# Быстрые команды: фраза или шаблон → скилл. Срабатывают до модели, всегда одинаково.
# {имя} в шаблоне становится аргументом скилла.

[[command]]
patterns = ["/браузер", "/браузер {url}", "открой браузер"]
skill = "browser"   # встроенный инструмент: то же окно, с которым работает агент

[[command]]
patterns = ["/тесты", "/тесты {path}", "запусти тесты {path}"]
skill = "run_pytest"

[[command]]
patterns = ["/git", "статус гита"]
skill = "git_status"
